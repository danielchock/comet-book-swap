<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Book Swap — UT Dallas Textbook Exchange</title>
<meta name="description" content="A free board for UT Dallas students to buy, sell, and find used course textbooks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='62' cy='42' r='16' fill='%23ff6a3d'/%3E%3Cpath d='M50 48 L8 88' stroke='%23ff6a3d' stroke-width='7' stroke-linecap='round' opacity='0.55'/%3E%3Cpath d='M56 46 L22 86' stroke='%23ff6a3d' stroke-width='5' stroke-linecap='round' opacity='0.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="starfield" aria-hidden="true"></div>
  <div class="header-inner">
    <div class="brand">
      <svg class="comet-mark" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="62" cy="42" r="16" fill="#ff6a3d"/>
        <path d="M50 48 L8 88" stroke="#ff6a3d" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
        <path d="M56 46 L22 86" stroke="#ff6a3d" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
        <path d="M60 50 L34 84" stroke="#ff6a3d" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
      </svg>
      <div class="brand-text">
        <h1>Comet Book Swap</h1>
        <p class="tagline">Buy, sell &amp; find used textbooks — by and for UT Dallas students</p>
      </div>
    </div>
    <button id="openFormBtn" class="btn btn-primary" type="button">
      <span aria-hidden="true">+</span> Post a listing
    </button>
  </div>
</header>

<main class="page">

  <section class="toolbar" aria-label="Search and filter listings">
    <div class="search-field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="search" id="searchInput" placeholder="Search by course code or title… e.g. “CS 3345” or “Calculus”" aria-label="Search listings">
    </div>

    <div class="filter-group" role="group" aria-label="Filter by listing type">
      <button class="chip is-active" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="selling" type="button">Selling</button>
      <button class="chip" data-filter="wanted" type="button">Wanted</button>
    </div>

    <label class="sold-toggle">
      <input type="checkbox" id="showSoldToggle">
      <span>Show sold listings</span>
    </label>
  </section>

  <p class="result-summary" id="resultSummary" aria-live="polite"></p>

  <section id="listingGrid" class="listing-grid" aria-live="polite"></section>

  <p id="emptyState" class="empty-state" hidden>
    No listings match your search. Try a different course code, or
    <button class="link-btn" id="clearFiltersBtn" type="button">clear filters</button>.
  </p>

</main>

<footer class="site-footer">
  <p>Comet Book Swap is a student side project — not affiliated with UT Dallas. Listings are stored locally in your browser.</p>
</footer>

<!-- Post listing modal -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Post a listing</h2>
      <button class="icon-btn" id="closeFormBtn" type="button" aria-label="Close">&times;</button>
    </div>

    <form id="listingForm" novalidate>
      <div class="type-toggle" role="radiogroup" aria-label="Listing type">
        <input type="radio" name="type" id="typeSelling" value="selling" checked>
        <label for="typeSelling">I'm selling</label>
        <input type="radio" name="type" id="typeWanted" value="wanted">
        <label for="typeWanted">I'm looking for</label>
      </div>

      <div class="field">
        <label for="titleInput">Book title</label>
        <input type="text" id="titleInput" name="title" placeholder="e.g. Discrete Mathematics and Its Applications" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="courseInput">Course code</label>
          <input type="text" id="courseInput" name="course" placeholder="e.g. CS 3345" required>
        </div>
        <div class="field">
          <label for="priceInput" id="priceLabel">Asking price</label>
          <div class="price-input">
            <span>$</span>
            <input type="number" id="priceInput" name="price" min="0" step="1" placeholder="45" required>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="conditionInput">Condition</label>
        <select id="conditionInput" name="condition" required>
          <option value="New">New</option>
          <option value="Like New">Like New</option>
          <option value="Good" selected>Good</option>
          <option value="Fair">Fair</option>
          <option value="Poor">Poor</option>
          <option value="Any">Any condition works</option>
        </select>
      </div>

      <div class="field">
        <label for="notesInput">Notes <span class="optional">(optional)</span></label>
        <textarea id="notesInput" name="notes" rows="3" placeholder="Edition, highlighting, bundled access codes, meetup spot, etc."></textarea>
      </div>

      <div class="field">
        <label for="contactInput">Contact</label>
        <input type="text" id="contactInput" name="contact" placeholder="NetID, email, or Discord handle" required>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Post listing</button>
      </div>
    </form>
  </div>
</div>

<template id="cardTemplate">
  <article class="card">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="card-top">
        <span class="badge"></span>
        <span class="course-pill"></span>
      </div>
      <h3 class="card-title"></h3>
      <p class="card-price"></p>
      <p class="card-condition"></p>
      <p class="card-notes"></p>
      <div class="card-contact">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="0" fill="none"/>
          <path d="M3 6l9 6 9-6M3 6v12h18V6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="contact-text"></span>
      </div>
      <div class="card-footer">
        <span class="posted-date"></span>
        <div class="card-actions">
          <button class="link-btn remove-btn" type="button">Remove</button>
          <button class="btn btn-small sold-btn" type="button">Mark as sold</button>
        </div>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
